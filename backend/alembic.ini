# Alembic de SART. Uso (desde backend/):
#   .venv/Scripts/python -m alembic upgrade head      aplicar migraciones
#   .venv/Scripts/python -m alembic revision --autogenerate -m "descripcion"   nueva migración (revisarla a mano)
# La URL de la base NO va aquí: se lee de DATABASE_URL (entorno o .env) en migraciones/env.py.

[alembic]
script_location = %(here)s/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
