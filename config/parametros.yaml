# Parámetros de SART (RNF-M-4). Todo valor que pueda cambiar tras las entrevistas o la calibración va aquí.
# Cada clave indica su origen en el informe. Cambiar un valor no requiere tocar código; queda auditado (RNF-S-4).

zona_horaria: America/Santiago

horarios:                    # RF-1, RF-2, RF-4, RNF-D-3
  respaldo: "04:30"          # RNF-D-2: antes de la ingesta de las 05:00 (supuesto, pendientes #38)
  ingesta: "05:00"           # diaria
  pronostico: "06:00"        # lunes
  alerta_ambiental: "07:00"  # diaria
  boletin_limite: "08:00"    # el boletín del lunes debe salir antes de esta hora
  dia_semanal: lunes         # RB-4: el pronóstico y el boletín salen los lunes
  boletin: "07:30"           # lunes, después del pronóstico y antes de boletin_limite (supuesto, T11)
  seguimiento_cada_minutos: 60  # RB-2: cada cuánto se revisa el reenvío (24 h) y el escalamiento (48 h) (T11)

escenario:                   # §2.3
  comunas: [Concepción, Coronel, Chiguayante, Hualpén, Hualqui, Lota, Penco, San Pedro de la Paz, Talcahuano, Tomé]
  estacion_respaldo: Kingston College   # RB-5

modelo:                      # CI-1, RF-2
  especificacion: solo_rezagos   # o con_pronostico (pendientes #1, opción C del 14/11): cambiarla cuando se valide
  version: "1"               # sube cuando cambian la fórmula o el panel; se guarda en cada pronóstico (RF-2 paso 3)
  anio_inicio: 2014          # primer año del panel y origen de la tendencia (notebook 5, pendientes #9)
  causas_senal_viral: [influenza, covid_identificado, covid_no_identificado]   # «viral» del panel (pendientes #26)
  anios_excluidos: [2020, 2021]
  anio_inicio_prueba: 2024
  armonicos: 3
  min_semanas_historia: 52
  nivel_intervalo: 0.90      # z = 1,645

umbrales:                    # RB-3 (pendientes #6, decidido el 14/11)
  cuantil_atencion: 0.75
  cuantil_alerta: 0.90
  anios_umbral: 3            # ventana = las últimas 52 × anios_umbral semanas válidas (156), sin 2020-2021
  recalculo: anual
  mes_recalculo: 3           # marzo, antes del invierno (supuesto por validar, pendientes #36)

regla_alerta:                # RF-3, RNF-Q-2, TC-17
  k_margen: 0.4              # elegido con el mismo backtest (optimista): recalibrar con 2024 y probar en 2025–2026 (E3)

mp25_niveles:                # RB-1 (D.S. 12/2011 y PPDA D.S. 6/2018), promedio 24 h en µg/m³
  normal_hasta: 50
  alerta_desde: 80
  preemergencia_desde: 110
  emergencia_desde: 170

notificaciones:              # RB-2, RF-5, RF-15
  reenvio_horas: 24
  escalamiento_horas: 48
  reintentos_envio: 3

dotacion:                    # CI-2, RF-6 (supuestos por validar en entrevistas, Anexo A pregunta 7)
  minutos_por_atencion: 15
  factor_hora_punta: 1.6
  espera_objetivo_min: 30
  supuestos_validados: false # RF-6 E1: mientras sea false, el correo y la web los muestran «por validar»
  horas_funcionamiento_semana:
    SAPU: 123                # lunes a viernes 17:00–08:00 y 24 h fines de semana y festivos
    SAR: 123
    SUR: null                # POR DEFINIR: el informe no lo indica
    hospital: 168

catalogo:                    # CI-3, RB-5 · asignación manual por comuna del notebook 5 (pendientes #9 y #10)
  estaciones:                # zona = comuna de la estación; la de respaldo es escenario.estacion_respaldo
    "Kingston College": {comuna: Concepción, fuente: SINCA, codigo_sinca: "827"}
    "Punteras": {comuna: Chiguayante, fuente: SINCA}          # código SINCA por verificar
    "Hualqui": {comuna: Hualqui, fuente: SINCA}               # código SINCA por verificar
    "JUNJI": {comuna: Hualpén, fuente: SINCA}                 # código SINCA por verificar
    "Cerro Merquín": {comuna: Coronel, fuente: SINCA}         # código SINCA por verificar
    "Coronel Norte": {comuna: Coronel, fuente: SINCA}         # código SINCA por verificar
    "Open-Meteo Concepción": {comuna: Concepción, fuente: Open-Meteo, latitud: -36.83, longitud: -73.05}
  estacion_por_comuna:       # comunas sin estación propia usan la más cercana (REVISAR, CI-3)
    Concepción: Kingston College
    Chiguayante: Punteras
    Hualqui: Hualqui
    Hualpén: JUNJI
    Talcahuano: JUNJI
    Coronel: Cerro Merquín
    Lota: Cerro Merquín
    San Pedro de la Paz: Kingston College
    Penco: Kingston College
    Tomé: Kingston College
  tipos_establecimiento:     # TipoEstablecimientoGlosa del registro → tipo de §5.1 (pendientes #5); el resto no se carga
    "Hospital": hospital
    "Servicio de Atención Primaria de Urgencia (SAPU)": SAPU
    "Servicio de Atención Primaria de Urgencia de Alta Resolutividad (SAR)": SAR
    "Servicio de Urgencia de Alta Resolución (SAR)": SAR
    "Servicio de Urgencia Rural (SUR)": SUR

ingesta:                     # RF-1, RNF-M-3
  causas:                    # inicio de la glosa del DEIS → clave guardada; el resto (hospitalizaciones, totales) no se carga
    "IRA Alta (J00-J06)": ira_alta
    "TOTAL ATENCIONES POR COVID-19, Virus Identificado U07.1": covid_identificado
    "TOTAL ATENCIONES POR COVID-19 Virus no Identificado U07.2": covid_no_identificado
    "Infección respiratoria aguda alta": ira_alta
    "Influenza": influenza
    "Neumonía": neumonia
    "Bronquitis/bronquiolitis aguda": bronquitis
    "Crisis obstructiva bronquial": obstructiva
    "Otra causa respiratoria": otra_respiratoria
    "Covid-19, virus identificado": covid_identificado        # U07: fuera de J00–J98, señal viral (pendientes #26)
    "Covid-19, virus no identificado": covid_no_identificado
  reintentos_fuente: 3
  avisar_tras_fallas_seguidas: 2
  causas_en_consultas: [ira_alta, influenza, neumonia, bronquitis, obstructiva, otra_respiratoria]  # las 6 J00–J98 (RF-1)
  # RB-4 (pendientes #3, decidido el 14/11): una semana está completa si reportan al menos la cobertura mínima de
  # los centros activos de las últimas semanas_centros_activos semanas Y su total no cae bajo factor_caida_total ×
  # la mediana de las semanas_mediana_previa semanas anteriores (detecta centros que reportan a medias).
  cobertura_minima_semana: 0.9     # 90 %: con 80 %, 29 de 33 centros (88 %) contaría como completa y el Gherkin de RF-1 falla
  semanas_centros_activos: 12
  factor_caida_total: 0.6
  semanas_mediana_previa: 4

consulta:                    # RF-7
  aviso_datos_antiguos_dias: 8   # RF-7 E1: desde el sábado que cierra la semana de corte
  semanas_historial: 12          # semanas observadas en el gráfico de Mi centro y el calendario de la red

auditoria:                   # RNF-S-4
  retencion_meses: 12

cuentas:                     # RF-16, RNF-S-1 (supuestos nuevos: ver docs/pendientes_informe.md)
  version_texto_finalidad: "2026-1"   # versión del texto de §5.3 que acepta el funcionario
  # Texto que el funcionario lee antes de aceptar (§5.3). Si cambia, subir version_texto_finalidad.
  texto_finalidad: >-
    SART guarda su nombre, correo institucional, rol y centros asignados solo para darle acceso según su rol
    y enviarle las notificaciones de alertas (RF-5, RF-7). No se usan para otro fin. Se conservan mientras la
    cuenta esté activa y se eliminan al darla de baja o al terminar el proyecto. Puede pedir conocerlos,
    corregirlos o eliminarlos al administrador (Ley 19.628 y Ley 21.719).
  largo_minimo_contrasena: 12

sesion:                      # RNF-S-1
  duracion_horas: 8          # un turno; después hay que volver a iniciar sesión

mfa:                         # RNF-S-1: códigos TOTP para administradores (supuestos nuevos: pendientes #19)
  emisor: SART               # nombre que muestra la aplicación de autenticación
  tolerancia_pasos: 1        # acepta el código de los 30 s anteriores o siguientes (reloj del teléfono)
  intentos_maximos: 5        # códigos incorrectos seguidos antes de bloquear
  bloqueo_minutos: 15

administracion:              # RF-9, opción a (pendientes #31): el valor de este archivo es el de partida. El
                             # administrador puede ajustar estas claves desde la web; el ajuste va a la base
                             # (parametro_ajustado) con autor, motivo y auditoría (RNF-S-4), y rige desde la
                             # corrida siguiente. Las demás claves solo se cambian editando este archivo.
  parametros_editables:
    - regla_alerta.k_margen
    - umbrales.cuantil_atencion
    - umbrales.cuantil_alerta
    - umbrales.anios_umbral
    - dotacion.minutos_por_atencion
    - dotacion.factor_hora_punta
    - dotacion.espera_objetivo_min
    - dotacion.horas_funcionamiento_semana.SAPU
    - dotacion.horas_funcionamiento_semana.SAR
    - dotacion.horas_funcionamiento_semana.SUR
    - dotacion.horas_funcionamiento_semana.hospital
    - notificaciones.reenvio_horas
    - notificaciones.escalamiento_horas

respaldo:                    # RNF-D-2, TC-14 (RPO 24 h, RTO 2 h)
  carpeta: respaldos         # relativa a la raíz del repo; fuera de la base. En producción, copiar a otro proveedor
  conservar: 14              # respaldos diarios que se guardan; los más antiguos se borran
  tablas_sin_datos:          # fuentes públicas: se vuelven a descargar (RNF-D-2); se respalda solo su estructura
    - consulta_semanal
    - medicion

descarga:
  timeout_segundos: 300
  maximo_bytes: 268435456
  espera_reintento_segundos: 1
  deis_url: "https://datos.gob.cl/dataset/606ef5bb-11d1-475b-b69f-b980da5757f4/resource/ae6c9887-106d-4e98-8875-40bf2b836041/download/at_urg_respiratorio_semanal.parquet"
  sinca:
    desde: "2009-08-12"
    retraso_dias: 2  # Margen inicial: reproduce el rango hasta 15/11 de la exportación que funcionó el 17/11.
    # El atraso real de publicación no está medido; este valor es configurable.
    estaciones:
      "Kingston College": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/827/Cal/PM25//PM25.diario.diario.ic&from=090812&to=261115&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
      "Cerro Merquín": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/831/Cal/PM25//PM25.diario.diario.ic&from=091007&to=260905&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
      "Coronel Norte": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/878/Cal/PM25//PM25.diario.diario.ic&from=191130&to=251130&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
      "Hualqui": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/841/Cal/PM25//PM25.diario.diario.ic&from=161126&to=261115&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
      "JUNJI": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/804/Cal/PM25//PM25.diario.diario.ic&from=111229&to=260629&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
      "Punteras": "https://sinca.mma.gob.cl/cgi-bin/APUB-MMA/apub.tsindico2.cgi?outtype=xcl&macro=./RVIII/854/Cal/PM25//PM25.diario.diario.ic&from=091006&to=260927&path=/usr/airviro/data/CONAMA/&lang=esp&rsrc=&macropath="
  open_meteo:
    latitud: -36.83
    longitud: -73.05
    retraso_clima_dias: 7
    dias_pronostico: 5
    clima_url: "https://archive-api.open-meteo.com/v1/archive"
    pronostico_url: "https://air-quality-api.open-meteo.com/v1/air-quality"