# Parámetros de SART (RNF-M-4). Todo valor que pueda cambiar tras las entrevistas o la calibración va aquí.
# Cada clave indica su origen en el informe. Cambiar un valor no requiere tocar código; queda auditado (RNF-S-4).

zona_horaria: America/Santiago

horarios:                    # RF-1, RF-2, RF-4, RNF-D-3
  ingesta: "05:00"           # diaria
  pronostico: "06:00"        # lunes
  alerta_ambiental: "07:00"  # diaria
  boletin_limite: "08:00"    # el boletín del lunes debe salir antes de esta hora

escenario:                   # §2.3
  comunas: [Concepción, Coronel, Chiguayante, Hualpén, Hualqui, Lota, Penco, San Pedro de la Paz, Talcahuano, Tomé]
  estacion_respaldo: Kingston College   # RB-5

modelo:                      # CI-1, RF-2
  anios_excluidos: [2020, 2021]
  anio_inicio_prueba: 2024
  armonicos: 3
  min_semanas_historia: 52
  nivel_intervalo: 0.90      # z = 1,645

umbrales:                    # RB-3
  cuantil_atencion: 0.75
  cuantil_alerta: 0.90
  anios_umbral: 3
  recalculo: anual

regla_alerta:                # RF-3, RNF-Q-2, TC-17
  k_margen: 0.4              # elegido con el mismo backtest (optimista): recalibrar con 2024 y probar en 2025–2026 (E3)

mp25_niveles:                # RB-1 (D.S. 12/2011 y PPDA D.S. 6/2018), promedio 24 h en µg/m³
  normal_hasta: 50
  alerta_desde: 80
  preemergencia_desde: 110
  emergencia_desde: 170

notificaciones:              # RB-2, RF-5, RF-15
  reenvio_horas: 24
  escalamiento_horas: 48
  reintentos_envio: 3

dotacion:                    # CI-2, RF-6 (supuestos por validar en entrevistas, Anexo A pregunta 7)
  minutos_por_atencion: 15
  factor_hora_punta: 1.6
  espera_objetivo_min: 30
  horas_funcionamiento_semana:
    SAPU: 123                # lunes a viernes 17:00–08:00 y 24 h fines de semana y festivos
    SAR: 123
    SUR: null                # POR DEFINIR: el informe no lo indica
    hospital: 168

catalogo:                    # CI-3, RB-5 · asignación manual por comuna del notebook 5 (pendientes #9 y #10)
  estaciones:                # zona = comuna de la estación; la de respaldo es escenario.estacion_respaldo
    "Kingston College": {comuna: Concepción, fuente: SINCA, codigo_sinca: "827"}
    "Punteras": {comuna: Chiguayante, fuente: SINCA}          # código SINCA por verificar
    "Hualqui": {comuna: Hualqui, fuente: SINCA}               # código SINCA por verificar
    "JUNJI": {comuna: Hualpén, fuente: SINCA}                 # código SINCA por verificar
    "Cerro Merquín": {comuna: Coronel, fuente: SINCA}         # código SINCA por verificar
    "Coronel Norte": {comuna: Coronel, fuente: SINCA}         # código SINCA por verificar
    "Open-Meteo Concepción": {comuna: Concepción, fuente: Open-Meteo, latitud: -36.83, longitud: -73.05}
  estacion_por_comuna:       # comunas sin estación propia usan la más cercana (REVISAR, CI-3)
    Concepción: Kingston College
    Chiguayante: Punteras
    Hualqui: Hualqui
    Hualpén: JUNJI
    Talcahuano: JUNJI
    Coronel: Cerro Merquín
    Lota: Cerro Merquín
    San Pedro de la Paz: Kingston College
    Penco: Kingston College
    Tomé: Kingston College
  tipos_establecimiento:     # TipoEstablecimientoGlosa del registro → tipo de §5.1 (pendientes #5); el resto no se carga
    "Hospital": hospital
    "Servicio de Atención Primaria de Urgencia (SAPU)": SAPU
    "Servicio de Urgencia de Alta Resolución (SAR)": SAR
    "Servicio de Urgencia Rural (SUR)": SUR

ingesta:                     # RF-1, RNF-M-3
  causas:                    # inicio de la glosa del DEIS → clave guardada; el resto (hospitalizaciones, totales) no se carga
    "Infección respiratoria aguda alta": ira_alta
    "Influenza": influenza
    "Neumonía": neumonia
    "Bronquitis/bronquiolitis aguda": bronquitis
    "Crisis obstructiva bronquial": obstructiva
    "Otra causa respiratoria": otra_respiratoria
    "Covid-19, virus identificado": covid_identificado        # U07: fuera de J00–J98, señal viral (pendientes #26)
    "Covid-19, virus no identificado": covid_no_identificado
  reintentos_fuente: 3
  avisar_tras_fallas_seguidas: 2
  cobertura_minima_semana: 0.8   # notebook: semana completa si reportan ≥ 80 % de los centros

consulta:                    # RF-7
  aviso_datos_antiguos_dias: 8

auditoria:                   # RNF-S-4
  retencion_meses: 12

cuentas:                     # RF-16, RNF-S-1 (supuestos nuevos: ver docs/pendientes_informe.md)
  version_texto_finalidad: "2026-1"   # versión del texto de §5.3 que acepta el funcionario
  largo_minimo_contrasena: 12

sesion:                      # RNF-S-1
  duracion_horas: 8          # un turno; después hay que volver a iniciar sesión

mfa:                         # RNF-S-1: códigos TOTP para administradores (supuestos nuevos: pendientes #19)
  emisor: SART               # nombre que muestra la aplicación de autenticación
  tolerancia_pasos: 1        # acepta el código de los 30 s anteriores o siguientes (reloj del teléfono)
  intentos_maximos: 5        # códigos incorrectos seguidos antes de bloquear
  bloqueo_minutos: 15

administracion:              # RF-9, opción a (pendientes #31): el valor de este archivo es el de partida. El
                             # administrador puede ajustar estas claves desde la web; el ajuste va a la base
                             # (parametro_ajustado) con autor, motivo y auditoría (RNF-S-4), y rige desde la
                             # corrida siguiente. Las demás claves solo se cambian editando este archivo.
  parametros_editables:
    - regla_alerta.k_margen
    - umbrales.cuantil_atencion
    - umbrales.cuantil_alerta
    - umbrales.anios_umbral
    - dotacion.minutos_por_atencion
    - dotacion.factor_hora_punta
    - dotacion.espera_objetivo_min
    - dotacion.horas_funcionamiento_semana.SAPU
    - dotacion.horas_funcionamiento_semana.SAR
    - dotacion.horas_funcionamiento_semana.SUR
    - dotacion.horas_funcionamiento_semana.hospital
    - notificaciones.reenvio_horas
    - notificaciones.escalamiento_horas
