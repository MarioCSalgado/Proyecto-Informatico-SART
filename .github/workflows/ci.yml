# CI de SART (TC-13, RNF-M-1, RNF-M-2): cada push a main y cada pull request corre el estilo, las pruebas y la
# cobertura del backend con un PostgreSQL 16 de verdad, y el lint, la compilación y las pruebas de la web.
# Los datos reales (datos/) no están en git: la regresión del backtest se salta aquí y se corre en local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest y cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sart
          POSTGRES_PASSWORD: sart-ci  # base desechable de la CI, no es un secreto
          POSTGRES_DB: sart
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sart:sart-ci@127.0.0.1:5432/sart
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Estilo (RNF-M-2, 0 errores)
        run: .venv/bin/python -m ruff check .
      - name: Migraciones
        run: .venv/bin/python -m alembic upgrade head
      - name: Pruebas
        run: .venv/bin/python -m pytest --cov=sart --cov-report=term
      - name: Cobertura de sart/dominio y sart/tareas ≥ 70 % (RNF-M-1)
        run: .venv/bin/python -m coverage report --include="sart/dominio/*,sart/tareas/*" --fail-under=70

  web:
    name: Web (lint, build y Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Pruebas
        run: npx vitest run
